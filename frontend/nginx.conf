server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests if necessary, but since our frontend talks directly to VITE_API_URL via browser CORS,
    # we don't strictly need reverse-proxying configuration here unless we want to route /api requests.
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
